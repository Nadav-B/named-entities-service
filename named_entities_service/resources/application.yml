server:
  port: 80

rabbitmq:
  host: ${RABBITMQ_HOST:localhost}
  port: ${RABBITMQ_PORT:5672}
  username: ${RABBITMQ_USERNAME:dreipc}
  password: ${RABBITMQ_PASSWORD:password}
  vhost: ${RABBITMQ_VHOST:/}

mongodb:
  username: ${MONGO_USERNAME:dreipc}
  password: ${MONGO_PASSWORD:secret}
  database: ${MONGO_DATABASE:example-database}
  port: ${MONGO_PORT:27017}
  host: ${MONGO_HOST:localhost}

resources:
  models: trained_models
  wiki-training-files: wikidata/training_files
  wiki-resources: wikidata/resources
  custom-training-files: custom/training_files
  custom-resources: custom/resources
